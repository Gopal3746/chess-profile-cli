[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chesscli"
version = "0.1.0"
description = "Explore Chess.com players from your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
chesscli = "chesscli.cli:main"

[tool.setuptools]
packages = ["chesscli"]
